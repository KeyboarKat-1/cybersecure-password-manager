<!-- Full-screen cybersecurity loading overlay -->
<div id="cybersecure-loader" class="loader-overlay" aria-hidden="true">
    <div class="loader-card">
        <div class="loader-ring" aria-hidden="true"></div>

        <div class="loader-grid">
            <div class="loader-terminal" aria-label="Initializing secure vault terminal output">
                <div class="terminal-header">
                    <span class="terminal-dot terminal-dot-red"></span>
                    <span class="terminal-dot terminal-dot-yellow"></span>
                    <span class="terminal-dot terminal-dot-green"></span>
                    <span class="terminal-title">CyberSecure Vault</span>
                </div>

                <div class="terminal-body">
                    <p class="loader-title">Loading CyberSecure...</p>
                    <p id="loader-subtitle" class="loader-subtitle">Initializing Secure Vault...</p>
                    <p class="loader-status">Establishing Secure Connection...</p>
                </div>
            </div>

            <div class="loader-hud" aria-label="System status dashboard">
                <div class="hud-line"></div>
                <div class="hud-row"><span>Secure channel:</span><strong>ACTIVE</strong></div>
                <div class="hud-row"><span>Encryption:</span><strong>AES-256 / TLS</strong></div>
                <div class="hud-row"><span>Threat scan:</span><strong>WAITING</strong></div>
                <div class="hud-scan"></div>
            </div>
        </div>
    </div>
</div>
