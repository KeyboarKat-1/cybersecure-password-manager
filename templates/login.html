<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    {% include '_loader.html' %}

    <div class="container">

        <div class="notification-wrapper">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="notification notification-{{ category }}">
                            <span>{{ message }}</span>
                            <button type="button" class="notification-close" aria-label="Dismiss message">×</button>
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
        </div>

        <h1>Login</h1>

        <form method="POST">

            <input type="text"
                   name="username"
                   placeholder="Username"
                   required>

            <input type="password"
                   name="password"
                   placeholder="Password"
                   required>

            <button type="submit">
                Login
            </button>

        </form>

        <p>
            Don't have an account?
            <a href="/register">Register</a>
        </p>

    </div>
    <script src="{{ url_for('static', filename='loader.js') }}" defer></script>
</body>
</html>
